<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Realistic 3D Off-Road Driving Simulator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            background-color: #050811;
        }

        /* ================= LAYOUT (grid + flex => elements can never overlap) ================= */
        :root {
            --sl: env(safe-area-inset-left, 0px);
            --sr: env(safe-area-inset-right, 0px);
            --st: env(safe-area-inset-top, 0px);
            --sb: env(safe-area-inset-bottom, 0px);
            --u: clamp(48px, min(15vh, 15vw), 76px);          /* base size of every touch control */
            --g: clamp(50px, calc(var(--u) * 1.05), 70px);    /* gauge diameter */
        }
        *, *::before, *::after { box-sizing: border-box; }
        .hidden { display: none !important; }
        body { color: #fff; }
        html, body { height: 100%; height: 100dvh; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
        #canvas-container { position: fixed; inset: 0; cursor: default; }
        #canvas-container canvas { display: block; width: 100% !important; height: 100% !important; outline: none; }

        /* ---- top area: colour picker | buttons / speedo + nitro | minimap ---- */
        #top-ui {
            position: fixed; z-index: 10; pointer-events: none;
            top: calc(var(--st) + 8px); left: calc(var(--sl) + 8px); right: calc(var(--sr) + 8px);
            display: grid; gap: 6px; align-items: start;
            grid-template-columns: auto 1fr auto;
            grid-template-areas: "p . b" "h . m";
        }
        @media (orientation: portrait) { #top-ui { grid-template-areas: "h . b" "h . p" "h . m"; } #picker-wrap { justify-self: end; } }
        #picker-wrap { grid-area: p; pointer-events: auto; height: 36px; padding: 0 10px; display: flex; align-items: center; border-radius: 12px; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); }
        #color-picker-container { display: flex; gap: 6px; }
        #top-btns { grid-area: b; justify-self: end; display: flex; gap: 4px; pointer-events: auto; }
        .tbtn { min-width: 38px; height: 36px; padding: 0 10px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 12px; font-size: 12px; color: #fff; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); }
        .tbtn:active { background: rgba(255,255,255,.2); }
        @media (max-width: 340px) { .tbtn { min-width: 32px; padding: 0 6px; } }
        #minimap { grid-area: m; justify-self: end; display: block; width: clamp(76px, 22vw, 104px); height: auto; aspect-ratio: 1 / 1; border-radius: 50%; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.2); pointer-events: none; }

        /* ---- small speedometer / gear / nitro, parked on the left side ---- */
        #hud-panel { grid-area: h; display: flex; flex-direction: column; gap: 6px; width: max-content; pointer-events: none; }
        #hud { display: flex; flex-direction: row; gap: 6px; }
        @media (orientation: portrait) { #hud { flex-direction: column; } }
        .gpanel { padding: 4px; border-radius: 16px; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); }
        .gauge-dial { position: relative; width: var(--g); height: var(--g); border-radius: 50%; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle, rgba(30,41,59,.85) 0%, rgba(15,23,42,.95) 100%); border: 2px solid rgba(255,255,255,.2); }
        .needle { position: absolute; bottom: 50%; left: calc(50% - 1.5px); width: 3px; height: 36%; background: linear-gradient(to top, #ef4444, #f87171); transform-origin: bottom center;
            transform: rotate(-120deg); transition: transform .05s ease-out; border-radius: 2px; box-shadow: 0 0 6px rgba(239,68,68,.8); }
        .gauge-text { position: relative; z-index: 2; margin-top: calc(var(--g) * .26); text-align: center; line-height: 1; }
        .gauge-text b { display: block; font-family: ui-monospace, monospace; font-weight: 800; font-size: calc(var(--g) * .27); }
        .gauge-text small { display: block; margin-top: 1px; font-size: calc(var(--g) * .13); opacity: .6; }
        #nitro-box { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 12px; background: rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.1); }
        .nitro-track { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,.2); overflow: hidden; }
        #nitro-fill { height: 8px; border-radius: 4px; background: #38bdf8; }

        /* ---- bottom bar: [steering] [4x4 / diff] [pedals] ---- */
        #bottom-ui { position: fixed; z-index: 10; pointer-events: none; left: calc(var(--sl) + 10px); right: calc(var(--sr) + 10px); bottom: calc(var(--sb) + 10px);
            display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px; }
        body:not(.is-touch) #bottom-ui { justify-content: flex-start; left: 16px; bottom: 16px; }
        #steer { order: 1; } #mode-wrap { order: 2; } #pedals { order: 3; }
        body.swap-ctrl #steer { order: 3; } body.swap-ctrl #pedals { order: 1; }
        @media (orientation: portrait) { #mode-wrap { order: -1; flex-basis: 100%; justify-content: center; } }
        #mode-wrap { display: flex; gap: 6px; pointer-events: auto; }
        .pill { height: 30px; padding: 0 12px; border-radius: 15px; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: #fff; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.25); }
        .pill.on { background: #f97316; border-color: #fb923c; }

        .touch-only { display: none; }
        body.is-touch .touch-only { display: flex; gap: 8px; align-items: flex-end; pointer-events: auto; }
        .pedal-col { display: flex; flex-direction: column; gap: 8px; }
        .touch-btn { position: relative; overflow: hidden; background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.25); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: #fff; padding: 0; margin: 0;
            font-size: clamp(1.1rem, calc(var(--u) * .42), 1.6rem); touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        .touch-btn i { position: relative; z-index: 1; pointer-events: none; }
        .touch-btn:active, .touch-btn.active { background: rgba(16,185,129,.6); transform: scale(.95); }
        .touch-btn.pedal { border-radius: calc(var(--u) * .36); }
        .touch-btn.analog:active, .touch-btn.analog.active { background: rgba(255,255,255,.18); transform: none; }   /* no scale: finger position maps to pedal travel */
        .touch-btn .fill { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--v, 0) * 100%); background: rgba(16,185,129,.7); pointer-events: none; }
        #btn-down .fill { background: rgba(244,63,94,.7); }
        body.no-analog .fill { display: none; }
        #btn-left, #btn-right { width: var(--u); height: calc(var(--u) * 1.15); }
        #btn-up   { width: calc(var(--u) * 1.05); height: calc(var(--u) * 1.7); }
        #btn-down { width: calc(var(--u) * 1.05); height: calc(var(--u) * 1.0); }
        #btn-nitro, #btn-brake { width: calc(var(--u) * .85); height: calc(var(--u) * .85); }

        /* virtual steering wheel (optional) */
        #wheel { display: none; width: calc(var(--u) * 2.3); height: calc(var(--u) * 2.3); border-radius: 50%; touch-action: none; }
        #wheel svg { width: 100%; height: 100%; display: block; pointer-events: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.55)); }
        #steer-buttons { display: flex; gap: 8px; align-items: flex-end; }
        body.steer-wheel #wheel { display: block; }
        body.steer-wheel #steer-buttons { display: none; }

        .color-dot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(255,255,255,.4); transition: transform .15s, border-color .15s; }
        .color-dot:hover { transform: scale(1.15); border-color: #fff; }
        body.is-touch .color-dot { width: 24px; height: 24px; }
        .qbtn { padding: 10px; border-radius: 12px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); font-size: 13px; color: #fff; }
        .qbtn.on { background: #f97316; border-color: #fb923c; }

        /* menu */
        #menu { position: fixed; inset: 0; padding: max(12px, var(--st)) max(12px, var(--sr)) max(12px, var(--sb)) max(12px, var(--sl)); overflow-y: auto; }
        #menu > div { max-height: calc(100dvh - 24px); overflow-y: auto; }
        @media (max-height: 430px) { #menu > div { padding: 14px; } #menu .space-y-4 > * + * { margin-top: 8px; } }
    </style>
</head>
<body class="text-white select-none">

    <!-- WebGL Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Top area -->
    <div id="top-ui">
        <div id="picker-wrap"><div id="color-picker-container"></div></div>
        <div id="top-btns">
            <button id="btn-toggle-lights" class="tbtn"><i class="fa-solid fa-lightbulb text-amber-400"></i></button>
            <button id="btn-toggle-tod" class="tbtn"><i class="fa-solid fa-sun text-yellow-400" id="icon-tod"></i><span class="hidden" id="label-tod">Day</span></button>
            <button id="btn-camera" class="tbtn"><i class="fa-solid fa-camera text-emerald-400"></i><span class="hidden" id="cam-mode-label">Orbit Free Look</span></button>
            <button id="btn-settings" class="tbtn"><i class="fa-solid fa-gear"></i></button>
            <button id="btn-full" class="tbtn"><i class="fa-solid fa-expand"></i></button>
            <button id="btn-reset" class="tbtn" style="color:#fb7185"><i class="fa-solid fa-rotate-left"></i></button>
        </div>
        <div id="hud-panel">
            <div id="hud">
                <div class="gpanel">
                    <div class="gauge-dial">
                        <div id="speed-needle" class="needle"></div>
                        <div class="gauge-text"><b id="speed-val">0</b><small>km/h</small></div>
                    </div>
                </div>
                <div class="gpanel">
                    <div class="gauge-dial">
                        <div id="rpm-needle" class="needle" style="background: linear-gradient(to top, #10b981, #34d399); box-shadow: 0 0 6px rgba(16,185,129,.8);"></div>
                        <div class="gauge-text"><b id="gear-val" style="color:#34d399">D</b><small>gear</small></div>
                    </div>
                </div>
            </div>
            <div id="nitro-box"><i class="fa-solid fa-bolt" style="font-size:11px;color:#38bdf8"></i><div class="nitro-track"><div id="nitro-fill" style="width:100%"></div></div></div>
        </div>
        <canvas id="minimap" width="120" height="120"></canvas>
    </div>

    <!-- Bottom bar -->
    <div id="bottom-ui">
        <div id="steer" class="touch-only">
            <div id="steer-buttons">
                <button id="btn-left" class="touch-btn pedal"><i class="fa-solid fa-chevron-left"></i></button>
                <button id="btn-right" class="touch-btn pedal"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div id="wheel">
                <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="43" fill="rgba(15,23,42,.45)" stroke="rgba(255,255,255,.6)" stroke-width="9"/><path d="M50 50 L9 63 M50 50 L91 63 M50 50 L50 92" stroke="rgba(255,255,255,.6)" stroke-width="7" stroke-linecap="round"/><circle cx="50" cy="50" r="10" fill="rgba(255,255,255,.7)"/><rect x="46.5" y="3" width="7" height="14" rx="2" fill="#f97316"/></svg>
            </div>
        </div>

        <div id="mode-wrap">
            <button id="btn-low" class="pill">4x4 LOW</button>
            <button id="btn-diff" class="pill">DIFF LOCK</button>
        </div>

        <div id="pedals" class="touch-only">
            <div class="pedal-col">
                <button id="btn-nitro" class="touch-btn" style="background:rgba(14,165,233,.45)"><i class="fa-solid fa-bolt"></i></button>
                <button id="btn-brake" class="touch-btn" style="background:rgba(225,29,72,.45)"><i class="fa-solid fa-hand"></i></button>
            </div>
            <div class="pedal-col">
                <button id="btn-up" class="touch-btn pedal analog"><span class="fill"></span><i class="fa-solid fa-chevron-up"></i></button>
                <button id="btn-down" class="touch-btn pedal analog"><span class="fill"></span><i class="fa-solid fa-chevron-down"></i></button>
            </div>
        </div>
    </div>

    <div id="menu" class="absolute inset-0 z-50 flex items-center justify-center" style="background:radial-gradient(circle at 50% 30%,rgba(15,23,42,.88),rgba(2,6,23,.97))">
        <div class="w-[92%] max-w-md p-6 rounded-3xl bg-slate-900/80 border border-white/10 text-center space-y-4">
            <div><div class="text-3xl font-black tracking-tight text-orange-400">OFF-ROAD EXTREME</div><div class="text-xs text-slate-400 mt-1">Climb everything. Conquer the map.</div></div>
            <div><div class="text-[11px] text-slate-400 mb-2 uppercase tracking-wider">Graphics</div>
                <div class="grid grid-cols-3 gap-2"><button data-q="low" class="qbtn">Low</button><button data-q="medium" class="qbtn">Medium</button><button data-q="high" class="qbtn">High</button></div></div>
            <div class="grid grid-cols-2 gap-2"><button id="opt-sound" class="qbtn">Sound: On</button><button id="opt-tilt" class="qbtn">Tilt steering: Off</button><button id="opt-steer" class="qbtn">Steering: Buttons</button><button id="opt-side" class="qbtn">Steering side: Left</button><button id="opt-analog" class="qbtn" style="grid-column: span 2">Analog pedals: On</button></div>
            <div><div class="text-[11px] text-slate-400 mb-1 uppercase tracking-wider">Camera sensitivity</div><input id="opt-sens" type="range" min="0.4" max="2.5" step="0.1" value="1" class="w-full"></div>
            <button id="btn-play" class="w-full py-3 rounded-2xl bg-orange-500 font-bold text-lg">PLAY</button>
            <div class="text-[11px] text-slate-500">WASD drive · Space handbrake · Shift nitro · F 4x4 low · G diff lock · C camera · R flip upright</div>
        </div>
    </div>

    <!-- Main Logic Script -->
    <script>
        // --- AUDIO ENGINE ---
        class VehicleAudioEngine {
            constructor() { this.ctx = null; this.initialized = false; }
            init() {
                if (this.initialized) return;
                try {
                    const c = this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.master = c.createGain(); this.master.gain.value = SET.sound ? 0.9 : 0;
                    const comp = c.createDynamicsCompressor(); this.master.connect(comp); comp.connect(c.destination);
                    // V8-style engine: saw + sub square + octave saw through a lowpass
                    this.o1 = c.createOscillator(); this.o1.type = 'sawtooth';
                    this.o2 = c.createOscillator(); this.o2.type = 'square';
                    this.o3 = c.createOscillator(); this.o3.type = 'sawtooth';
                    this.ef = c.createBiquadFilter(); this.ef.type = 'lowpass'; this.ef.Q.value = 1.6;
                    this.eg = c.createGain(); this.eg.gain.value = 0.05;
                    [[this.o1, 0.5], [this.o2, 0.4], [this.o3, 0.05]].forEach(([o, v]) => { const g = c.createGain(); g.gain.value = v; o.connect(g); g.connect(this.ef); o.start(); });
                    this.ef.connect(this.eg); this.eg.connect(this.master);
                    const n = c.sampleRate * 2, buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
                    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
                    this.nbuf = buf;
                    const loop = (freq, q) => { const s = c.createBufferSource(); s.buffer = buf; s.loop = true; const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q; const g = c.createGain(); g.gain.value = 0; s.connect(f); f.connect(g); g.connect(this.master); s.start(); return { f, g }; };
                    this.skidN = loop(1600, 1.2); this.windN = loop(500, 0.5); this.dirtN = loop(220, 0.8);
                    const tone = (type, fr) => { const o = c.createOscillator(); o.type = type; o.frequency.value = fr; const g = c.createGain(); g.gain.value = 0; o.connect(g); g.connect(this.master); o.start(); return { o, g }; };
                    this.rumN = loop(150, 0.9);   // exhaust rumble (no turbo whistle / brake squeal)
                    this.initialized = true;
                } catch (e) { console.warn('Audio disabled', e); }
            }
            _s(param, v, tc) { param.setTargetAtTime(v, this.ctx.currentTime, tc || 0.06); }
            update(rpm, thr, spd, boost) {
                if (!this.initialized) return;
                const f = rpm / 30;
                this._s(this.o1.frequency, f); this._s(this.o2.frequency, f * 0.5); this._s(this.o3.frequency, f * 2.01);
                this._s(this.ef.frequency, 300 + rpm * 0.4 + thr * 600 + boost * 150);
                this._s(this.eg.gain, 0.05 + thr * 0.07 + (rpm / 6400) * 0.05 + boost * 0.03);
                this._s(this.windN.g.gain, Math.min(0.09, spd / 1500)); this._s(this.windN.f.frequency, 300 + spd * 8);
                this._s(this.dirtN.g.gain, Math.min(0.06, spd / 2500));
                this._s(this.rumN.g.gain, 0.012 + thr * 0.05 + boost * 0.05); this._s(this.rumN.f.frequency, 80 + rpm * 0.04);
            }
            skid(l) { if (this.initialized) this._s(this.skidN.g.gain, l * 0.16, 0.05); }
            brake(l) { /* squeal removed */ }
            _hit(i, noise) {
                const c = this.ctx, t = c.currentTime;
                const th = c.createOscillator(), tg = c.createGain();
                th.frequency.setValueAtTime(110, t); th.frequency.exponentialRampToValueAtTime(32, t + 0.35);
                tg.gain.setValueAtTime(0.9 * i, t); tg.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
                th.connect(tg); tg.connect(this.master); th.start(t); th.stop(t + 0.45);
                if (!noise) return;
                const s = c.createBufferSource(); s.buffer = this.nbuf;
                const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
                const g = c.createGain(); g.gain.setValueAtTime(0.9 * i, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
                s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + 0.6);
                [380, 611].forEach(fr => { const o = c.createOscillator(); o.type = 'triangle'; o.frequency.value = fr; const og = c.createGain(); og.gain.setValueAtTime(0.14 * i, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.45); o.connect(og); og.connect(this.master); o.start(t); o.stop(t + 0.5); });
            }
            pick() { if (!this.initialized) return; const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(700, t); o.frequency.exponentialRampToValueAtTime(1500, t + 0.15); g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3); o.connect(g); g.connect(this.master); o.start(t); o.stop(t + 0.35); }
            crash(i) { if (this.initialized) this._hit(i, true); }
            thump(i) { if (this.initialized) this._hit(i * 0.7, false); }
        }

        const audioEngine = new VehicleAudioEngine();
        ['keydown', 'mousedown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => audioEngine.init(), { once: true }));
        
        // --- THREE.JS SCENE SETUP ---
        const CONTAINER = document.getElementById('canvas-container');
        const IS_MOBILE = /Android|iPhone|iPad|Mobi/i.test(navigator.userAgent);
        const IS_TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
        document.body.classList.toggle('is-touch', IS_TOUCH);
        const QT = {
            low:    { pr: 0.9,  aa: false, shadow: 0,    seg: 180, trees: 60,  rocks: 60,  refl: 0,   far: 550,  fog: 0.006,  rp: 0 },
            medium: { pr: 1.1,  aa: false, shadow: 1024, seg: 220, trees: 180, rocks: 140, refl: 192, far: 900,  fog: 0.0038, rp: 3 },
            high:   { pr: 1.5,  aa: true,  shadow: 2048, seg: 300, trees: 400, rocks: 280, refl: 384, far: 1400, fog: 0.0026, rp: 2 }
        };
        const HIDE_REFL = [];
        const SET = { q: IS_MOBILE ? 'medium' : 'high', tilt: false, sound: true, sens: 1, steerMode: 'buttons', side: 'left', analog: true };
        try { Object.assign(SET, JSON.parse(localStorage.getItem('offroadSet') || '{}')); } catch (e) {}
        const saveSet = () => { try { localStorage.setItem('offroadSet', JSON.stringify(SET)); } catch (e) {} };
        const Q = QT[SET.q] || QT.medium;
        const PM = Q.shadow >= 2048 ? THREE.MeshPhysicalMaterial : THREE.MeshStandardMaterial;
        let menuOpen = true, frameN = 0, tiltSteer = null, lastLook = 0;
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0xaaccff, Q.fog);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, Q.far);
        const renderer = new THREE.WebGLRenderer({ antialias: Q.aa, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight, false);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, Q.pr));
        renderer.shadowMap.enabled = Q.shadow > 0;
        renderer.shadowMap.type = THREE.PCFShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        CONTAINER.appendChild(renderer.domElement);

        // --- LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.65);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfff7ed, 1.6);
        sunLight.position.set(120, 160, 80);
        sunLight.castShadow = Q.shadow > 0;
        sunLight.shadow.mapSize.width = Q.shadow || 1;
        sunLight.shadow.mapSize.height = Q.shadow || 1;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 380;
        const shadowDist = 40;
        sunLight.shadow.camera.left = -shadowDist;
        sunLight.shadow.camera.right = shadowDist;

                try { btn.setPointerCapture(e.pointerId); } catch (err) {}

            ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => btn.addEventListener(t, release));

            releaseFns.push(() => { down.clear(); keys[keyName] = false; btn.classList.remove('active'); });

            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();

                pid = e.pointerId;

        let wasLocked = false;

                const camDist = orbitDistance + Math.min(4, Math.abs(physics.speedKmh) * 0.025);
                const camX = physics.pos.x - Math.sin(totalYaw) * Math.cos(orbitPitch) * camDist;

        function updateHUD() {

        }

        function stepPhysics(dt) {
            dt = Math.min(dt, 1 / 30);
            const spd = Math.abs(physics.speedKmh / 3.6);
            updateWheel(dt);
            const steerKb = (keys.left ? 1 : 0) - (keys.right ? 1 : 0);
            const steerIn = tiltSteer !== null ? tiltSteer : clamp(steerKb + wheelSteer, -1, 1);
            const maxS = 0.62 / (1 + spd * 0.055);
            physics.steeringAngle += (steerIn * maxS - physics.steeringAngle) * Math.min(1, dt * 12);
            if (steeringWheelPivot) steeringWheelPivot.rotation.z = -physics.steeringAngle * 2.8;

            _fwd.set(0, 0, 1).applyQuaternion(physics.q);
            const vF = physics.vel.dot(_fwd);
            const gasAmt = keys.forward ? ana.gas : 0, downAmt = keys.backward ? ana.down : 0;
            let drive = 0, brakeIn = 0;
            if (gasAmt > 0) { if (vF < -1.5 && _fwd.y < 0.12) brakeIn = gasAmt; else { drive = gasAmt; physics.reverse = false; } }   // rolling back uphill? just drive
            if (downAmt > 0) { if (vF > 1.5) brakeIn = downAmt; else { drive = -downAmt; physics.reverse = true; } }
            if (!drive && physics.reverse && vF > -0.3) physics.reverse = false;
            physics.throttle += (Math.abs(drive) - physics.throttle) * Math.min(1, dt * 8);
            physics.driftFactor = keys.brake ? 1 : 0;
            // pedal position = target speed: the further the pedal is pulled, the faster the truck goes
            const topV = (physics.reverse ? 12 : 40 + 12 * physics.boost) * (mode.low ? 0.45 : 1);
            physics.govern = clamp((Math.abs(drive) * topV - Math.abs(vF)) / 5, 0, 1);

            if (keys.nitro && physics.nitro > 0 && drive > 0) { physics.boost += (1 - physics.boost) * Math.min(1, dt * 10); physics.nitro = Math.max(0, physics.nitro - dt * 0.22); }
            else { physics.boost -= physics.boost * Math.min(1, dt * 6); physics.nitro = Math.min(1, physics.nitro + dt * (keys.nitro ? 0 : 0.08)); }
            nitroFillEl.style.width = (physics.nitro * 100).toFixed(0) + '%';
            const steps = 3, h = dt / steps;
            for (let i = 0; i < steps; i++) subStep(h, drive, brakeIn);

            _fwd.set(0, 0, 1).applyQuaternion(physics.q);
            physics.angle = Math.atan2(_fwd.x, _fwd.z);
            physics.speedKmh = physics.vel.dot(_fwd) * 3.6;
            _up.set(0, 1, 0).applyQuaternion(physics.q);
            if (_up.y < 0.3 && Math.abs(physics.speedKmh) < 4) physics.flipT = (physics.flipT || 0) + dt; else physics.flipT = 0;
            if (physics.flipT > 2.2) { uprightCar(); physics.flipT = 0; }   // stuck on roof / side: flip back automatically
            carMesh.position.copy(physics.pos);
            carMesh.quaternion.copy(physics.q);

            carData.wheels.forEach(w => {
                const L = clamp(w.len, LEN_MIN, LEN_MAX);
                w.visLen = (w.visLen === undefined || L < w.visLen ? L : w.visLen + (L - w.visLen) * Math.min(1, dt * 18));
                w.susPivot.position.y = MOUNT_Y - w.visLen;
                w.springMesh.scale.set(1, Math.max(0.3, w.visLen / 0.5), 1);
                w.springMesh.position.y = w.visLen * 0.5 + 0.05;
                if (w.isFront) w.steerHub.rotation.y = physics.steeringAngle;
                w.spinAngle += w.spinRate * dt;
                w.spinGroup.rotation.x = w.spinAngle;
                if (w.grounded && w.slip > 2.2 && Math.random() < 0.55) {
                    _cp.set(w.relX, MOUNT_Y - w.visLen - WR + 0.1, w.relZ).applyQuaternion(physics.q).add(physics.pos);
                    emitSmokeFog(_cp, physics.vel, Math.min(1.5, w.slip * 0.3), w.surf ? w.surf.col : 0xb09070);
                }
            });

            let ci = false;
            particleData.forEach((p, idx) => {
                if (p.life > 0) {
                    p.life -= dt;
                    p.pos.addScaledVector(p.vel, dt);
                    p.rot += p.rotSpeed * dt;
                    const progress = 1 - (p.life / p.maxLife);
                    const sc = p.scale + progress * (p.maxScale - p.scale);
                    dummy.position.copy(p.pos);
                    dummy.rotation.set(0, 0, p.rot);
                    dummy.scale.setScalar(sc * Math.max(0, 1 - progress * progress));
                    dummy.lookAt(camera.position);
                    dummy.updateMatrix();
                    particleInstanced.setMatrixAt(idx, dummy.matrix);
                    particleInstanced.setColorAt(idx, p.col); ci = true;
                } else if (p.pos.y > -99) {
                    p.pos.y = -100;
                    dummy.position.set(0, -100, 0); dummy.scale.setScalar(0.001); dummy.updateMatrix();
                    particleInstanced.setMatrixAt(idx, dummy.matrix);
                }
            });
            particleInstanced.instanceMatrix.needsUpdate = true;
            if (ci && particleInstanced.instanceColor) particleInstanced.instanceColor.needsUpdate = true;

            let sk = 0; carData.wheels.forEach(w => { if (w.grounded) sk = Math.max(sk, w.slip); });
            const spdA = Math.abs(physics.speedKmh), nowT = performance.now() / 1000;
            audioEngine.update(physics.rpm, physics.throttle, spdA, physics.boost);
            audioEngine.skid(sk > 2.2 && spdA > 8 ? Math.min(1, (sk - 2.2) / 6) : 0);
            audioEngine.brake(((brakeIn || keys.brake) && spdA > 12) ? Math.min(1, spdA / 80) : 0);
            if (physics.crashI > 0.12 && nowT - lastCrashT > 0.25) { audioEngine.crash(Math.min(1.5, physics.crashI)); lastCrashT = nowT; }
            physics.crashI = 0;
            if (physics.landI > 4) { audioEngine.thump(Math.min(1, physics.landI / 14)); }
            physics.landI = 0;
        }

        // --- NITRO ORBS (collectibles) ---
        const ORB_N = 90, orbMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.9, 12, 10), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }), ORB_N), orbs = [], od = new THREE.Object3D();
        orbMesh.frustumCulled = false;
        for (let i = 0; i < ORB_N; i++) {
            let x, z, y, tries = 0;
            do { const a = Math.random() * 6.283, R = 50 + Math.random() * 200;
                if (i < 14) { x = Math.cos(a) * R; z = Math.sin(a) * R; } else { x = (Math.random() - 0.5) * TERRAIN_SIZE * 0.9; z = (Math.random() - 0.5) * TERRAIN_SIZE * 0.9; }
                y = getTerrainHeight(x, z); } while (y < 0.2 && ++tries < 50);
            orbs.push({ x, y: y + 1.4, z, t: 0 });
        }
        scene.add(orbMesh);
        function checkOrbs(dt) {
            const tm = performance.now() / 400;
            for (let i = 0; i < ORB_N; i++) {
                const o = orbs[i];
                if (o.t > 0) o.t -= dt;
                else if (Math.abs(o.x - physics.pos.x) < 3.5 && Math.abs(o.z - physics.pos.z) < 3.5 && Math.abs(o.y - physics.pos.y) < 4) { o.t = 25; physics.nitro = 1; audioEngine.pick(); }
                od.position.set(o.x, o.y + Math.sin(tm + i) * 0.25, o.z); od.scale.setScalar(o.t > 0 ? 0.0001 : 1); od.updateMatrix(); orbMesh.setMatrixAt(i, od.matrix);
            }
            orbMesh.instanceMatrix.needsUpdate = true;
        }

        // --- MINIMAP ---
        const mmBg = document.createElement('canvas'); mmBg.width = mmBg.height = 256;
        (function () {
            const g = mmBg.getContext('2d'), im = g.createImageData(256, 256);
            for (let j = 0; j < 256; j++) for (let i = 0; i < 256; i++) {
                const h = getBaseHeight((i / 256 - 0.5) * TERRAIN_SIZE, (j / 256 - 0.5) * TERRAIN_SIZE); let r, gg, b;
                if (h < -0.5) { r = 30; gg = 90; b = 170; } else if (h < 20) { r = 50 + h * 2; gg = 110 + h; b = 50; } else if (h < 45) { r = 110 + h; gg = 100 + h * 0.5; b = 80; } else { r = 230; gg = 235; b = 240; }
                const k = (j * 256 + i) * 4; im.data[k] = r; im.data[k + 1] = gg; im.data[k + 2] = b; im.data[k + 3] = 255;
            }
            g.putImageData(im, 0, 0);
        })();
        const mmCtx = document.getElementById('minimap').getContext('2d');
        function updateMinimap() {
            if (frameN & 3) return;
            const c = mmCtx; c.clearRect(0, 0, 120, 120); c.save(); c.beginPath(); c.arc(60, 60, 60, 0, 6.283); c.clip();
            c.translate(60, 60); c.rotate(physics.angle - Math.PI); const sc = 60 / 220; c.scale(sc, sc);
            c.drawImage(mmBg, -physics.pos.x - TERRAIN_SIZE / 2, -physics.pos.z - TERRAIN_SIZE / 2, TERRAIN_SIZE, TERRAIN_SIZE);
            c.fillStyle = '#38bdf8';
            orbs.forEach(o => { const dx = o.x - physics.pos.x, dz = o.z - physics.pos.z; if (o.t <= 0 && Math.abs(dx) < 240 && Math.abs(dz) < 240) { c.beginPath(); c.arc(dx, dz, 7, 0, 6.283); c.fill(); } });
            c.restore(); c.fillStyle = '#f97316'; c.beginPath(); c.moveTo(60, 48); c.lineTo(66, 66); c.lineTo(54, 66); c.fill();
        }

        // --- MENU / SETTINGS ---
        const menuEl = document.getElementById('menu');
        function openMenu() { releaseAllInputs(); tiltSteer = null; menuOpen = true; menuEl.style.display = 'flex'; if (document.pointerLockElement) document.exitPointerLock(); }
        function syncMenu() {
            document.querySelectorAll('[data-q]').forEach(b => b.classList.toggle('on', b.dataset.q === SET.q));
            document.getElementById('opt-sound').innerText = 'Sound: ' + (SET.sound ? 'On' : 'Off');
            document.getElementById('opt-tilt').innerText = 'Tilt steering: ' + (SET.tilt ? 'On' : 'Off');
            document.getElementById('opt-sens').value = SET.sens;
            document.getElementById('opt-steer').innerText = 'Steering: ' + (SET.steerMode === 'wheel' ? 'Wheel' : 'Buttons');
            document.getElementById('opt-side').innerText = 'Steering side: ' + (SET.side === 'right' ? 'Right' : 'Left');
            document.getElementById('opt-analog').innerText = 'Analog pedals: ' + (SET.analog ? 'On' : 'Off');
            ['opt-tilt', 'opt-steer', 'opt-side', 'opt-analog'].forEach(id => document.getElementById(id).style.display = IS_TOUCH ? '' : 'none');
            document.body.classList.toggle('steer-wheel', SET.steerMode === 'wheel');
            document.body.classList.toggle('swap-ctrl', SET.side === 'right');
            document.body.classList.toggle('no-analog', !SET.analog);
        }
        syncMenu();
        document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { if (SET.q !== b.dataset.q) { SET.q = b.dataset.q; saveSet(); location.reload(); } });
        document.getElementById('opt-sound').onclick = () => { SET.sound = !SET.sound; saveSet(); syncMenu(); if (audioEngine.master) audioEngine.master.gain.value = SET.sound ? 0.9 : 0; };
        document.getElementById('opt-tilt').onclick = () => { SET.tilt = !SET.tilt; saveSet(); syncMenu(); };
        document.getElementById('opt-steer').onclick = () => { SET.steerMode = SET.steerMode === 'wheel' ? 'buttons' : 'wheel'; saveSet(); syncMenu(); };
        document.getElementById('opt-side').onclick = () => { SET.side = SET.side === 'right' ? 'left' : 'right'; saveSet(); syncMenu(); };
        document.getElementById('opt-analog').onclick = () => { SET.analog = !SET.analog; saveSet(); syncMenu(); };
        document.getElementById('opt-sens').oninput = (e) => { SET.sens = parseFloat(e.target.value); saveSet(); };
        document.getElementById('btn-settings').onclick = openMenu;
        document.getElementById('btn-full').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen(); };
        document.getElementById('btn-play').onclick = async () => {
            menuEl.style.display = 'none'; menuOpen = false; audioEngine.init();
            if (audioEngine.master) audioEngine.master.gain.value = SET.sound ? 0.9 : 0;
            if (IS_TOUCH) {
                try { if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); } catch (e) {}
                if (SET.tilt && window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) { try { await DeviceOrientationEvent.requestPermission(); } catch (e) {} }
            } else if (CONTAINER.requestPointerLock) CONTAINER.requestPointerLock();
        };

        let _fpsT = performance.now(), _fpsN = 0, curPR = Math.min(window.devicePixelRatio || 1, Q.pr);
        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta();
            if (!menuOpen) { stepPhysics(dt); checkOrbs(dt); }
            updateCamera(dt);
            if (physics.shake > 0.002) {
                camera.position.x += (Math.random() - 0.5) * physics.shake;
                camera.position.y += (Math.random() - 0.5) * physics.shake;
                physics.shake *= 0.9;
            }
            sunLight.position.set(physics.pos.x + 120, physics.pos.y + 160, physics.pos.z + 80);
            sunLight.target.position.copy(physics.pos);
            updateHUD();

            frameN++;
            sky.position.copy(camera.position);
            skyMat.uniforms.hor.value.copy(scene.fog.color); skyMat.uniforms.top.value.setHex(isNight ? 0x02040c : 0x2c6cc0);
            const wu = waterMat.uniforms; wu.time.value += dt; wu.sky.value.copy(scene.background); wu.fogC.value.copy(scene.fog.color); wu.night.value = isNight ? 0.2 : 1;
            if (frameN % 15 === 0) nearW = checkNearWater();
            if (reflOn && nearW && frameN % Q.rp === 0) renderReflection();
            // adaptive resolution: keeps weak devices smooth automatically
            _fpsN++; const nowM = performance.now();
            if (nowM - _fpsT > 1000) {
                const fps = _fpsN * 1000 / (nowM - _fpsT); _fpsN = 0; _fpsT = nowM;
                if (!menuOpen && frameN > 240) {
                    const maxPR = Math.min(window.devicePixelRatio || 1, Q.pr);
                    if (fps < 40 && curPR > (IS_TOUCH ? 0.85 : 0.7)) { curPR = Math.max(IS_TOUCH ? 0.85 : 0.7, curPR - 0.1); resizeGameRenderer(); }
                    else if (fps > 52 && curPR < maxPR) { curPR = Math.min(maxPR, curPR + 0.08); resizeGameRenderer(); }
                    if (fps < 32 && curPR <= 0.7) {
                        if (reflOn) { reflOn = false; waterMat.uniforms.useRefl.value = 0; }
                        else if (sunLight.castShadow) sunLight.castShadow = false;
                    }
                }
            }
            updateMinimap();
            renderer.render(scene, camera);
        }

        function resizeGameRenderer() {
            const w = Math.max(1, window.innerWidth);
            const h = Math.max(1, window.innerHeight);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setPixelRatio(curPR || Math.min(window.devicePixelRatio || 1, Q.pr));
            renderer.setSize(w, h, false);
        }
        window.addEventListener('resize', resizeGameRenderer, { passive: true });
        window.addEventListener('orientationchange', () => { setTimeout(resizeGameRenderer, 100); setTimeout(resizeGameRenderer, 400); }, { passive: true });
        if (window.visualViewport) window.visualViewport.addEventListener('resize', resizeGameRenderer, { passive: true });
        document.addEventListener('fullscreenchange', () => setTimeout(resizeGameRenderer, 150));

        window.onload = () => {
            animate();
        };
    </script>
</body>
</html>
